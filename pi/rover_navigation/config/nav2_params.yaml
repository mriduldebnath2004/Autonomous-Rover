bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered


controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 15.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.10
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      desired_linear_vel: 0.20

      lookahead_dist: 0.40
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.55
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true

      rotate_to_heading_min_angle: 0.35
      rotate_to_heading_angular_vel: 0.8
      max_angular_accel: 3.2

      transform_tolerance: 0.2

      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.30

      use_collision_detection: true
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false

      use_rotate_to_heading: true
      allow_reversing: true


planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 10.0

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.25
      use_astar: true
      allow_unknown: true


smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true


behavior_server:
  ros__parameters:
    use_sim_time: false

    global_frame: odom
    robot_base_frame: base_link

    transform_tolerance: 0.2
    cycle_frequency: 10.0

    behavior_plugins:
      ["spin", "backup", "drive_on_heading", "wait"]

    spin:
      plugin: "nav2_behaviors::Spin"

    backup:
      plugin: "nav2_behaviors::BackUp"

    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"

    wait:
      plugin: "nav2_behaviors::Wait"


waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false


velocity_smoother:
  ros__parameters:
    use_sim_time: false

    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"

    max_velocity: [0.20, 0.0, 0.8]
    min_velocity: [-0.20, 0.0, -0.8]

    max_accel: [0.35, 0.0, 2.5]
    max_decel: [-0.35, 0.0, -2.5]

    odom_topic: /odometry/filtered
    odom_duration: 0.1

    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false

      global_frame: map
      robot_base_frame: base_link

      update_frequency: 5.0
      publish_frequency: 2.0

      resolution: 0.05
      track_unknown_space: true
      always_send_full_costmap: true

      footprint: "[[0.15, 0.17], [0.15, -0.17], [-0.18, -0.17], [-0.18, 0.17]]"

      plugins:
        ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: false

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true

        observation_sources: scan

        scan:
          topic: /scan
          max_obstacle_height: 2.0

          clearing: true
          marking: true

          data_type: "LaserScan"

          raytrace_max_range: 12.0
          raytrace_min_range: 0.0

          obstacle_max_range: 10.0
          obstacle_min_range: 0.10

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        inflation_radius: 0.45
        cost_scaling_factor: 12.0


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false

      global_frame: odom
      robot_base_frame: base_link

      update_frequency: 10.0
      publish_frequency: 5.0

      always_send_full_costmap: true

      rolling_window: true
      width: 2
      height: 2
      resolution: 0.02

      footprint: "[[0.15, 0.17], [0.15, -0.17], [-0.18, -0.17], [-0.18, 0.17]]"

      plugins:
        ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true

        observation_sources: scan

        scan:
          topic: /scan
          max_obstacle_height: 2.0

          clearing: true
          marking: true

          data_type: "LaserScan"

          raytrace_max_range: 12.0
          raytrace_min_range: 0.0

          obstacle_max_range: 10.0
          obstacle_min_range: 0.10

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        inflation_radius: 0.05
        cost_scaling_factor: 100.0


collision_monitor:
  ros__parameters:
    use_sim_time: false

    base_frame_id: base_link
    odom_frame_id: odom

    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel

    transform_tolerance: 0.2
    source_timeout: 1.0

    polygons: ["SlowdownZone", "StopZone"]

    SlowdownZone:
      type: "polygon"

      points: "[[0.20, 0.20], [0.20, -0.20], [-0.23, -0.20], [-0.23, 0.20]]"

      action_type: "slowdown"
      slowdown_ratio: 0.5
      min_points: 3

    StopZone:
      type: "polygon"

      points: "[[0.15, 0.15], [0.15, -0.15], [-0.18, -0.15], [-0.18, 0.15]]"

      action_type: "stop"
      min_points: 3

    observation_sources: ["scan"]

    scan:
      type: "scan"
      topic: /scan

      min_height: 0.0
      max_height: 2.0

      enabled: true