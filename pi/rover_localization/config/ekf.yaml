    odom0: /wheel/odometry

    odom0_config: [
      false, false, false,
      false, false, false,
      true,  true,  false,
      false, false, false,
      false, false, false
    ]

    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_twist_rejection_threshold: 3.0

    imu0: /imu/data_raw

    imu0_config: [
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, true,
      false, false, false
    ]

    imu0_queue_size: 10
    imu0_nodelay: true
    imu0_remove_gravitational_acceleration: false
