ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true

    publish_tf: true
    publish_acceleration: false
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /wheel/odometry
    odom0_config:
      [false, false, false,
       false, false, false,
       true,  false, false,
       false, false, false,
       false, false, false]

    odom0_queue_size: 10

    imu0: /imu/data_raw
    imu0_config:
      [false, false, false,
       false, false, false,
       false, false, false,
       false, false, true,
       false, false, false]

    imu0_queue_size: 10
