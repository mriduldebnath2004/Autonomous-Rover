ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true

    # Scale pose process noise according to rover velocity.
    # This prevents X, Y and yaw covariance from rapidly growing
    # while the rover is stationary.
    dynamic_process_noise_covariance: true

    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /wheel/odometry

    odom0_config:
      [
        false, false, false,
        false, false, false,
        true,  true,  false,
        false, false, false,
        false, false, false
      ]

    odom0_queue_size: 10
    odom0_nodelay: true

    odom0_twist_rejection_threshold: 3.0

    imu0: /imu/data_raw

    imu0_config:
      [
        false, false, false,
        false, false, false,
        false, false, false,
        false, false, true,
        false, false, false
      ]

    imu0_queue_size: 10
    imu0_nodelay: true
    imu0_remove_gravitational_acceleration: false
